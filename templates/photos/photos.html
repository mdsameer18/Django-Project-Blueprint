<!doctype html>
<html>
  <head>
    <title>Google Photos</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial;
        background-color: #f8f9fa;
      }

      /* Header */

      header {
        height: 70px;
        background-color: white;
        display: flex;
        align-items: center;
        padding: 15px 25px;
        gap: 25px;
      }

      .logo {
        font-size: 23px;
        color: #4285f4;
        width: 220px;
      }

      input {
        width: 500px;
        padding: 15px;
        border: none;
        border-radius: 25px;
        background-color: #f0f3f8;
        font-size: 16px;
      }

      .profile {
        margin-left: auto;
        background-color: #4285f4;
        color: white;
        padding: 12px;
        border-radius: 50%;
      }

      /* Sidebar */

      .sidebar {
        width: 220px;
        height: 100vh;
        background-color: #f8f9fa;
        position: fixed;
        padding: 20px;
      }

      .sidebar p {
        padding: 15px;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .sidebar p:hover {
        background-color: #e3eaf5;
        border-radius: 25px;
      }

      .active {
        background-color: #dce8fc;
        border-radius: 25px;
      }

      /* Main Content */

      .content {
        margin-left: 240px;
        padding: 25px;
      }

      h2 {
        margin-bottom: 20px;
        font-weight: normal;
      }

      /* Memories */

      .memories {
        display: flex;
        gap: 20px;
        margin-bottom: 35px;
      }

      .memory {
        width: 200px;
      }

      .memory img {
        width: 200px;
        height: 130px;
        object-fit: cover;
        border-radius: 15px;
      }

      .memory p {
        margin-top: 10px;
      }

      /* Photos */

      .photos {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      .photos img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 12px;
      }

      .photos img:hover {
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <!-- Header -->

    <header>
      <div class="logo">🌈 Google Photos</div>

      <input type="text" placeholder="Search your photos" />

      <div class="profile">S</div>
    </header>

    <!-- Sidebar -->

    <div class="sidebar">
      <p class="active">📷 Photos</p>
      <p>📁 Collections</p>
      <p>🔗 Sharing</p>
      <p>⭐ Favourites</p>
      <p>🗑️ Trash</p>
      <p>📦 Archive</p>
    </div>

    <!-- Main Content -->

    <div class="content">
      <h2>Memories</h2>

      <div class="memories">
        <div class="memory">
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"
          />
          <p>Nature memories</p>
        </div>

        <div class="memory">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"
          />
          <p>Beautiful beaches</p>
        </div>

        <div class="memory">
          <img
            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400"
          />
          <p>Mountain views</p>
        </div>

        <div class="memory">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400"
          />
          <p>Travel memories</p>
        </div>
      </div>

      <h2>Photos</h2>

      <div class="photos">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500"
        />

        <img
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"
        />
      </div>
    </div>
  </body>
</html>
